services:
  - type: web
    name: block-by-block-backend
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: Dockerfile
    
    # Environment variables (non-secret)
    env:
      - key: PORT
        value: "8000"
      - key: PYTHON_VERSION
        value: "3.12"
    
    # Secrets (configure in Render dashboard)
    envVars:
      - key: SUPABASE_DB_URL
        scope: project
      - key: SECRET_KEY
        scope: project
      - key: OPENROUTER_API_KEY
        scope: project
      - key: HSK_RPC_URL
        value: https://testnet.hsk.xyz
      - key: HSK_CHAIN_ID
        value: "133"
      - key: AGENT_ADDRESS
        scope: project
      - key: AGENT_PRIVATE_KEY
        scope: project
      - key: CAUSE_VAULT_ADDRESS
        scope: project
      - key: ALLOWED_ORIGINS
        value: "https://block-by-block-backend.onrender.com,http://localhost:3000"
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_HOURS
        value: "24"

