services:
  - type: web
    name: block-by-block-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: HSK_RPC_URL
        value: https://testnet.hsk.xyz
      - key: HSK_CHAIN_ID
        value: "133"
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_HOURS
        value: "24"
      - key: OPENROUTER_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AGENT_ADDRESS
        sync: false
      - key: AGENT_PRIVATE_KEY
        sync: false
      - key: CAUSE_VAULT_ADDRESS
        sync: false
